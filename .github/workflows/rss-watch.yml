name: RSS Watch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: morning
        type: choice
        options:
          - morning
          - update
      dry_run:
        description: "Do not post to Slack or advance hosted state"
        required: true
        default: true
        type: boolean
      scheduled_delivery:
        description: "Apply the external scheduler's time-window and duplicate safeguards"
        required: true
        default: false
        type: boolean

concurrency:
  group: rss-watch-state
  cancel-in-progress: false

jobs:
  rss-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select the intended Eastern-time run
        id: prepare
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          SCHEDULED_DELIVERY: ${{ inputs.scheduled_delivery }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo

          now_et = dt.datetime.now(dt.timezone.utc).astimezone(ZoneInfo("America/New_York"))
          mode = os.environ.get("MANUAL_MODE") or "morning"
          scheduled_delivery = (
              os.environ.get("SCHEDULED_DELIVERY", "false").lower() == "true"
          )
          within_window = (
              mode == "morning" and 7 <= now_et.hour < 12
          ) or (
              mode == "update" and 13 <= now_et.hour < 18
          )
          should_run = not scheduled_delivery or within_window
          dry_run = (
              False
              if scheduled_delivery
              else os.environ.get("MANUAL_DRY_RUN", "true").lower() == "true"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
              output.write(f"mode={mode}\n")
              output.write(f"dry_run={'true' if dry_run else 'false'}\n")
          PY

      - name: Set up Python
        if: steps.prepare.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore hosted de-duplication state
        if: steps.prepare.outputs.should_run == 'true'
        id: state-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            projects/rss-watch/output/state.json
            projects/rss-watch/output/schedule-state.json
          key: rss-watch-state-${{ github.run_id }}
          restore-keys: |
            rss-watch-state-

      - name: Skip a fallback after successful delivery
        if: steps.prepare.outputs.should_run == 'true'
        id: delivery
        env:
          RUN_MODE: ${{ steps.prepare.outputs.mode }}
          SCHEDULED_DELIVERY: ${{ inputs.scheduled_delivery }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          marker_path = Path("projects/rss-watch/output/schedule-state.json")
          try:
              marker = json.loads(marker_path.read_text(encoding="utf-8"))
          except (FileNotFoundError, json.JSONDecodeError):
              marker = {}

          mode = os.environ["RUN_MODE"]
          today_et = dt.datetime.now(
              dt.timezone.utc
          ).astimezone(ZoneInfo("America/New_York")).date().isoformat()
          already_completed = marker.get("completed", {}).get(mode) == today_et
          should_execute = (
              os.environ.get("SCHEDULED_DELIVERY", "false").lower() != "true"
              or not already_completed
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  f"should_execute={'true' if should_execute else 'false'}\n"
              )
          PY

      - name: Prepare private feed configuration and initial state
        if: steps.delivery.outputs.should_execute == 'true'
        env:
          RSS_WATCH_OPML_B64: ${{ secrets.RSS_WATCH_OPML_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RSS_WATCH_OPML_B64" ]; then
            echo "Missing required RSS_WATCH_OPML_B64 repository secret." >&2
            exit 1
          fi
          mkdir -p projects/rss-watch/output
          printf '%s' "$RSS_WATCH_OPML_B64" | base64 --decode > projects/rss-watch/output/feeds.opml
          if [ ! -f projects/rss-watch/output/state.json ]; then
            python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          state = {
              "last_checked": dt.datetime.now(dt.timezone.utc).isoformat(),
              "seen_ids": [],
          }
          Path("projects/rss-watch/output/state.json").write_text(
              json.dumps(state, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY
          fi

      - name: Run RSS Watch
        if: steps.delivery.outputs.should_execute == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.RSS_WATCH_SLACK_WEBHOOK_URL }}
          RUN_MODE: ${{ steps.prepare.outputs.mode }}
          DRY_RUN: ${{ steps.prepare.outputs.dry_run }}
        working-directory: projects/rss-watch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ] && [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Missing required RSS_WATCH_SLACK_WEBHOOK_URL repository secret." >&2
            exit 1
          fi
          args=(
            --opml output/feeds.opml
            --mode "$RUN_MODE"
            --window-hours 72
            --since-last-checked
            --state output/state.json
            --out output/hosted-last-run.json
            --candidates-out output/hosted-candidates.json
            --brief output/hosted-briefing.md
            --max-items 200
            --max-item-age-days 30
            --feed-timeout-seconds 8
            --feed-retries 0
            --parallelism 12
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          PYTHONPATH=src python -m rss_watch.cli "${args[@]}"
          if [ "$DRY_RUN" != "true" ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("output/hosted-last-run.json").read_text(encoding="utf-8"))
          if payload.get("slack_status") != "sent" or not payload.get("state_updated"):
              raise SystemExit("RSS Watch did not complete Slack delivery and state update")
          PY
          fi

      - name: Record successful delivery
        if: steps.delivery.outputs.should_execute == 'true' && steps.prepare.outputs.dry_run != 'true' && success()
        env:
          RUN_MODE: ${{ steps.prepare.outputs.mode }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          marker_path = Path("projects/rss-watch/output/schedule-state.json")
          try:
              marker = json.loads(marker_path.read_text(encoding="utf-8"))
          except (FileNotFoundError, json.JSONDecodeError):
              marker = {}

          completed = marker.setdefault("completed", {})
          completed[os.environ["RUN_MODE"]] = dt.datetime.now(
              dt.timezone.utc
          ).astimezone(ZoneInfo("America/New_York")).date().isoformat()
          marker_path.parent.mkdir(parents=True, exist_ok=True)
          marker_path.write_text(
              json.dumps(marker, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Save hosted de-duplication state
        if: steps.delivery.outputs.should_execute == 'true' && success()
        uses: actions/cache/save@v5
        with:
          path: |
            projects/rss-watch/output/state.json
            projects/rss-watch/output/schedule-state.json
          key: rss-watch-state-${{ github.run_id }}

      - name: Upload briefing and diagnostics
        if: steps.delivery.outputs.should_execute == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: rss-watch-${{ steps.prepare.outputs.mode }}-${{ github.run_id }}
          path: |
            projects/rss-watch/output/hosted-briefing.md
            projects/rss-watch/output/hosted-last-run.json
            projects/rss-watch/output/hosted-candidates.json
          if-no-files-found: ignore
          retention-days: 14
