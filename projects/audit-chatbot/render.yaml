services:
  - type: web
    name: audit-chatbot
    env: python
    plan: starter
    buildCommand: sh -lc 'mkdir -p .render-deps && if [ -f requirements.txt ]; then python3 -m pip install --target .render-deps -r requirements.txt; else python3 -m pip install --target .render-deps -r projects/audit-chatbot/requirements.txt; fi'
    startCommand: sh -lc 'if [ -d src/audit_chatbot ]; then APP_DIR=. APP_SRC=src APP_SCRIPT=scripts/start-render.sh; else APP_DIR=projects/audit-chatbot APP_SRC=projects/audit-chatbot/src APP_SCRIPT=projects/audit-chatbot/scripts/start-render.sh; fi; export APP_ROOT=$APP_DIR; export PYTHONPATH=.render-deps:$APP_SRC; sh "$APP_SCRIPT"'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OPENAI_API_KEY
        sync: false
      - key: AUDIT_CHATBOT_AUTH_USERNAME
        sync: false
      - key: AUDIT_CHATBOT_AUTH_PASSWORD
        sync: false
      - key: AUDIT_CHATBOT_DB_PATH
        value: /var/data/audit-chatbot.db
      - key: AUDIT_CHATBOT_SEEDED_DB
        value: audit-chatbot-combined.db
    disk:
      name: audit-chatbot-db
      mountPath: /var/data
      sizeGB: 8
