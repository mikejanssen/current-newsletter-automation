services:
  - type: web
    name: newsroom-chatbot
    env: python
    plan: starter
    buildCommand: sh -lc 'mkdir -p .render-deps && if [ -f requirements.txt ]; then python3 -m pip install --target .render-deps -r requirements.txt; else python3 -m pip install --target .render-deps -r projects/newsroom-chatbot/requirements.txt; fi'
    startCommand: sh -lc 'if [ -d src/newsroom_chatbot ]; then APP_SRC=src; else APP_SRC=projects/newsroom-chatbot/src; fi; export PYTHONPATH=.render-deps:$APP_SRC; python3 -m uvicorn newsroom_chatbot.app:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWSROOM_AUTH_USERNAME
        sync: false
      - key: NEWSROOM_AUTH_PASSWORD
        sync: false
      - key: NEWSROOM_DB_PATH
        value: /var/data/newsroom.db
    disk:
      name: newsroom-db
      mountPath: /var/data
      sizeGB: 2
