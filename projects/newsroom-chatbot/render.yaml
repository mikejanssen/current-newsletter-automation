services:
  - type: web
    name: newsroom-chatbot
    env: python
    plan: starter
    buildCommand: sh -lc 'python3 -m venv .venv && if [ -f requirements.txt ]; then .venv/bin/python -m pip install -r requirements.txt; else .venv/bin/python -m pip install -r projects/newsroom-chatbot/requirements.txt; fi'
    startCommand: sh -lc 'if [ -d src/newsroom_chatbot ]; then PYTHONPATH=src; else PYTHONPATH=projects/newsroom-chatbot/src; fi; export PYTHONPATH; .venv/bin/python -m uvicorn newsroom_chatbot.app:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWSROOM_AUTH_USERNAME
        sync: false
      - key: NEWSROOM_AUTH_PASSWORD
        sync: false
      - key: NEWSROOM_DB_PATH
        value: /var/data/newsroom.db
    disk:
      name: newsroom-db
      mountPath: /var/data
      sizeGB: 2
